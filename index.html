 const d=5,vh=2*d*Math.tan(cam.fov*Math.PI/360),th=vh*.4,tx=zm.sd*vh*cam.aspect*.24,w=zm.w,h=zm.h,s=th/h;
 V.position.set(wp.x+(tx-wp.x)*e,wp.y*(1-e),wp.z+(-d-wp.z)*e);V.scale.set(w+(w*s-w)*e,h+(th-h)*e,1);V.rotation.y=zm.fr.rotation.y*(1-e);
 if(zm.dir>0&&zm.t>.85)$('ex').classList.add('show');
 if(zm.dir<0&&zm.t<=0){V.visible=false;zm.fr.visible=true;zm=null;document.documentElement.style.overflow='';}}

let page='home',lang='id',camZ=6,mx=0,my=0,active=-2,dive=0,diveT=0,busy=false;
const $=id=>document.getElementById(id),spacer=$('spacer'),dots=[...document.querySelectorAll('#dots i')];
function setLang(l){lang=l;document.documentElement.lang=l;document.querySelectorAll('[data-i]').forEach(e=>e.textContent=L[l][e.dataset.i]);
 document.querySelectorAll('[data-lang]').forEach(b=>b.classList.toggle('on',b.dataset.lang===l));showStage(active,true);
 try{localStorage.setItem('lang',l)}catch(e){}}
function showStage(i,force){if(i===active&&!force)return;active=i;const p=$('panel');
 if(i<0){p.classList.remove('show')}else{const s=L[lang].st[i];$('pTag').textContent=s.tag;$('pTtl').textContent=s.t;$('pSch').textContent=s.s;$('pTxt').textContent=s.p;p.classList.add('show')}
 dots.forEach((d,j)=>d.classList.toggle('on',j===i));}
function go(p){page=p;H.visible=p==='home';J.visible=p==='journey';spacer.style.height=p==='journey'?'1100vh':'0';scrollTo(0,0);camZ=6;diveT=0;dive=0;
 $('homeUI').classList.toggle('on',p==='home');$('jUI').classList.toggle('on',p==='journey');
 $('nHome').classList.toggle('on',p==='home');$('nJ').classList.toggle('on',p==='journey');showStage(-1,true);}
function warp(p){if(busy||p===page||zm)return;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){go(p);return}
 busy=true;const w=$('wipe');diveT=1;w.className='in';
 setTimeout(()=>{go(p);w.className='out'},720);
 setTimeout(()=>{w.className='rst'},1300);
 setTimeout(()=>{w.className='';busy=false},1360);}
$('nHome').onclick=()=>warp('home');$('nJ').onclick=()=>warp('journey');$('cta').onclick=()=>warp('journey');
document.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;
 if(page==='journey'&&!zm&&!busy){hov=pick(e);document.body.style.cursor=hov?'pointer':''}});
addEventListener('click',e=>{if(e.target.closest('header'))return;if(zm){closeZ();return}
 if(page!=='journey'||busy)return;const h=pick(e);if(h)openZ(h)});
addEventListener('keydown',e=>{if(e.key==='Escape')closeZ()});
function resize(){const w=innerWidth,h=innerHeight;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();
 const wide=w/h>1.1&&w>760;H.position.set(wide?2.6:0,wide?0:1.4,0);H.scale.setScalar(wide?1:.7);}
addEventListener('resize',resize);resize();

const clock=new THREE.Clock();
function tick(){requestAnimationFrame(tick);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;
 if(page==='home'){dive+=(diveT-dive)*.05;H.rotation.y+=(mx*.4-H.rotation.y)*.05;H.rotation.x+=(my*.25-H.rotation.x)*.05;hf.position.y=Math.sin(t)*.12;orb.rotation.y=t*.25+dive*3;ring.rotation.z=t*.1;
  cam.position.set(0,0,7-dive*3.2);cam.lookAt(H.position.x*.4,H.position.y*.4,0);}
 else{const max=document.documentElement.scrollHeight-innerHeight,p=max>0?scrollY/max:0;camZ+=((6-p*90)-camZ)*.08;
  cam.position.set(Math.sin(t*.4)*.3,.5+Math.cos(t*.3)*.1,camZ);cam.lookAt(0,.3,camZ-10);
  S.forEach(s=>s.f.forEach((f,j)=>{f.position.y=(j?.9:.7)+Math.sin(t+s.z+j)*.12;const tg=hov&&hov.userData.fr===f&&!zm?1.07:1;f.scale.setScalar(f.scale.x+(tg-f.scale.x)*.15)}));
  FL.forEach(f=>f.position.y=f.userData.y+Math.sin(t*.8+f.userData.p)*.3);showStage(S.findIndex(s=>{const d=camZ-s.z;return d>3&&d<13}));
  $('intro').style.opacity=Math.max(0,Math.min(1,(camZ-4.6)/1.4));
  cam.updateMatrixWorld();stepZ(dt);}
 R.render(scene,cam);}
let saved='id';try{saved=localStorage.getItem('lang')||'id'}catch(e){}
setLang(L[saved]?saved:'id');tick();
</script>
