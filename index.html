function ph(kind,label,w,h){const c=document.createElement('canvas');c.width=400;c.height=Math.round(400*h/w);const x=c.getContext('2d'),W=c.width,H=c.height;
 const g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#fffaf0');g.addColorStop(1,'#ead9bb');x.fillStyle=g;x.fillRect(0,0,W,H);

 x.fillStyle='#2b211c';x.font='600 '+Math.round(W*.06)+'px sans-serif';x.textAlign='center';x.fillText(label,W/2,H*.95);
 return new THREE.CanvasTexture(c);}
function cover(t,fa){const ia=t.image.width/t.image.height;if(ia>fa){t.repeat.set(fa/ia,1);t.offset.set((1-fa/ia)/2,0)}else{t.repeat.set(1,ia/fa);t.offset.set(0,(1-ia/fa)/2)}}
function frame(key,kind,label,w,h){const g=new THREE.Group();
